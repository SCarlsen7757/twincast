name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, lint, formatting and unit tests. Runs first because it takes ~20s and
  # catches the ordinary mistakes, where the Docker build below takes minutes.
  # The image build would surface a type error in src/ on its own, but nothing
  # here would otherwise check test/ -- tsconfig.build.json excludes it.
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guards the .gitattributes eol=lf rule. Note an ubuntu runner checks out LF
      # regardless, so this cannot catch a Windows-only CRLF regression -- that is
      # what .gitattributes itself is for.
      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

  # Build amd64 only and prove the container actually serves the board before
  # anything is published. POLL_ON_START=false keeps this independent of Beckhoff
  # being reachable from a GitHub runner.
  smoke:
    name: Build and smoke test
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: twincast:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e POLL_ON_START=false \
            -e DB_PATH=/data/board.db \
            twincast:smoke
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/tv; then
              echo "board responded after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "board never responded"; docker logs smoke; exit 1

      - name: Check the routes and the empty-state contract
        run: |
          set -e
          # /tv must render even with an empty database and no feed access.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/tv)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          # /healthz must report unhealthy while no releases are stored.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = "503"
          # The API must still answer rather than error.
          curl -fsS http://127.0.0.1:8080/api/news | grep -q '"itemCount":0'
          # Attribution must be present on every render, including the empty state.
          curl -fsS http://127.0.0.1:8080/tv | grep -q 'Beckhoff Automation'
          echo "all route checks passed"

      - name: Container logs
        if: always()
        run: docker logs smoke || true

  publish:
    name: Publish to GHCR
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase, and this repository's owner
      # (SCarlsen7757) is not. Derive the name rather than using
      # github.repository verbatim.
      - name: Resolve lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Twincast
            org.opencontainers.image.description=Info-screen board for the Beckhoff TwinCAT RSS release feed (unofficial)
            org.opencontainers.image.licenses=MIT

      # linux/arm64 is for the Raspberry Pi. Nothing is compiled at install time
      # (SQLite is Node's built-in node:sqlite), so the emulated arm64 build is
      # just dependency install plus file copies and stays fast.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
