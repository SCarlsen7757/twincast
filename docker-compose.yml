services:
  board:
    build: .
    pull_policy: always
    container_name: twincast
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Clock in the header. Set to the screen's local timezone.
      TZ: Europe/Copenhagen

      # Feed. Swap FEED_URL for any other Beckhoff RSS feed.
      FEED_URL: https://www.beckhoff.com/english/rss/beckhoff-twincat-rss-feed.xml
      POLL_INTERVAL_MIN: '30'

      # Identify yourself honestly. Beckhoff's WAF rejects `curl/*` with 403; this
      # lets them recognise, contact or block the poller. Put a real contact in it.
      USER_AGENT: 'Twincast/1.0 (+https://github.com/SCarlsen7757/twincast)'

      # Board behaviour.
      HERO_COUNT: '6'
      RAIL_COUNT: '8'
      ROTATE_SECONDS: '25'
      STALE_AFTER_MIN: '120'

    volumes:
      # SQLite database + cached logo. Keeps history across restarts and lets the
      # board render when Beckhoff is unreachable.
      - board-data:/data

volumes:
  board-data:
